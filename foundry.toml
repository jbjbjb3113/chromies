[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "solady/=lib/solady/src/",
]

fs_permissions = [
    { access = "read", path = "./art-pipeline/output" },
    { access = "read-write", path = "./chromies-engine/generated" },
    { access = "read-write", path = "chromies-engine/generated" },
    { access = "read", path = "./chromies-engine/engine_data" },
    { access = "read", path = "./chromies-engine/generated" },
    { access = "read", path = "./reports/robinhood" },
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
# Robinhood Chain Testnet (chain id 46630). Point ROBINHOOD_TESTNET_RPC_URL at an
# Alchemy app (https://robinhood-testnet.g.alchemy.com/v2/<key>) if set; otherwise
# defaults to the public RPC documented at docs.robinhood.com/chain/connecting.
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
# Robinhood Chain mainnet (chain id 4663), per docs.robinhood.com/chain/connecting.
# The initial contract deploy (2026-07-11) used the public RPC directly per JB ruling;
# ALCHEMY_RH_MAINNET_URL is now set and wired here as the hard gate before mintOpen is
# ever flipped.
robinhood_mainnet = "${ALCHEMY_RH_MAINNET_URL}"

[profile.gasstress]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./" }]

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.etherscan.io/api" }